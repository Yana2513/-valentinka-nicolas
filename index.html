<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carta para ti 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(135deg, #ffd6e8, #ffeccf);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
}

.screen {
    display: none;
    animation: fade 0.8s ease;
}

.active {
    display: block;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    border-radius: 25px;
    border: none;
    background: white;
    color: #ff7aa2;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 122, 162, 0.3);
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

img {
    width: 220px;
    border-radius: 20px;
    margin-bottom: 20px;
}

h1 {
    color: #ff5f94;
}

.big-love {
    font-size: 40px;
    margin-top: 10px;
    animation: pulse 1.5s infinite;
}

@keyframes fade {
    from {opacity: 0;}
    to {opacity: 1;}
}

@keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.1);}
    100% {transform: scale(1);}
}
</style>
</head>
<body>

<!-- SCREEN 1 -->
<div id="screen1" class="screen active">
    <img src="https://media.tenor.com/Y8zQ6Rkq0i8AAAAi/love-letter.gif">
    <h1>Tengo una carta para ti... 💌</h1>
    <button onclick="next(2)">Siguiente</button>
</div>

<!-- SCREEN 2 -->
<div id="screen2" class="screen">
    <img src="https://media.tenor.com/2roX3uxz_68AAAAi/cute-cat.gif">
    <h1>¿Quieres abrirla? (´• ω •`)</h1>
    <button onclick="next(3)">Abrir</button>
    <button onclick="next(3)">No abrir</button>
</div>

<!-- SCREEN 3 -->
<div id="screen3" class="screen">
    <img src="https://media.tenor.com/TKpmwX0bq3MAAAAi/hello-kitty.gif">
    <h1>Oh no, no son tetas</h1>
    <div class="big-love">Te amo (♡°▽°♡)</div>
</div>

<script>
function next(screenNumber) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen' + screenNumber).classList.add('active');
}
</script>

</body>
</html>
