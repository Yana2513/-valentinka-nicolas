<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti, Nicolás</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 50px;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: black;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    transition: background 1s;
}

h1 {
    font-size: 40px;
    margin: 20px;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background-color: hotpink;
    color: white;
}

#message {
    margin-top: 30px;
    font-size: 24px;
}

#finalScreen {
    display: none;
    background: white;
    width: 100%;
    min-height: 100vh;
    color: black;
    position: relative;
}

#finalMessage {
    font-size: 50px;
    font-weight: bold;
    margin-top: 100px;
    animation: pulse 1s infinite alternate;
}

#heartArt {
    font-size: 100px;
    color: crimson;
    animation: pulse 1s infinite alternate;
    margin-top: 20px;
}

/* Падающие сердечки */
.heart {
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: crimson;
    transform: rotate(45deg);
    animation: fall 5s linear infinite;
    z-index: 9999;
}
.heart::before, .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    background-color: crimson;
    border-radius: 50%;
}
.heart::before { top: -10px; left: 0; }
.heart::after { top: 0; left: -10px; }

/* Падающие звездочки */
.star {
    position: absolute;
    width: 8px;
    height: 8px;
    background: gold;
    border-radius: 50%;
    animation: starFall linear infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.3); }
}

@keyframes fall {
    0% { transform: translateY(0) rotate(45deg); opacity: 1; }
    100% { transform: translateY(700px) rotate(45deg); opacity: 0; }
}

@keyframes starFall {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(600px) scale(0.5); opacity: 0; }
}

/* Адаптив для мобильных */
@media (max-width: 600px) {
    h1 { font-size: 28px; padding: 10px; }
    button { font-size: 18px; padding: 12px 20px; margin: 5px; }
    #message { font-size: 20px; }
    #finalMessage { font-size: 36px; }
    #heartArt { font-size: 60px; }
    .heart { width: 15px; height: 15px; }
    .heart::before, .heart::after { width: 15px; height: 15px; }
    .star { width: 6px; height: 6px; }
}
</style>
</head>
<body>
<h1>¿Eres un idiota? (♡°▽°♡)</h1>
<div id="message"></div>
<div id="buttons">
    <button id="btnYes">Sí</button>
    <button id="btnNo">No</button>
</div>

<!-- Финальный экран -->
<div id="finalScreen">
    <div id="finalMessage">Я люблю тебя(´｡• ω •｡`) ♡</div>
    <div id="heartArt">❤</div>
</div>

<script>
let heartInterval;

// Создание сердечек
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.animationDuration = 3 + Math.random() * 2 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
}

// Создание звездочек
function createStar() {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * window.innerWidth + "px";
    star.style.animationDuration = 2 + Math.random() * 2 + "s";
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 3000);
}

// Диалоги
const dialogues = {
    yes: [
        {text: "sí?", button: "Sí"},
        {text: "¿cree que puede haber tetas?", button: "¡si!!! (´♡‿♡`)"},
        {text: "¡no son tetas!", button: "NOOO (ಥ﹏ಥ)"},
        {text: "¡Vete al diablo!٩(ఠ益ఠ)۶", button: "aceptar y llorar (╥_╥)"}
    ],
    no: [
        {text: "sí", button: "no"},
        {text: "Sí!(ノ°益°)ノ", button: "NO! (☆ω☆)"},
        {text: "Si.", button: "sí, soy un idiota"},
        {text: "sí, lo sé (￢‿￢ )", button: "aceptar y llorar (╥_╥)"}
    ]
};

// Управление диалогом
function startDialogue(path) {
    let index = 0;
    const messageDiv = document.getElementById("message");
    const buttonsDiv = document.getElementById("buttons");

    function nextStep() {
        if (index < path.length) {
            messageDiv.innerHTML = path[index].text;
            buttonsDiv.innerHTML = `<button id="dialogBtn">${path[index].button}</button>`;
            document.getElementById("dialogBtn").onclick = () => {
                index++;
                nextStep();
            };
        } else {
            showFinalScreen();
        }
    }
    nextStep();
}

// Финальный экран
function showFinalScreen() {
    document.getElementById("message").style.display = "none";
    document.getElementById("buttons").style.display = "none";
    const finalScreen = document.getElementById("finalScreen");
    finalScreen.style.display = "block";

    // Запуск сердечек и звездочек
    heartInterval = setInterval(createHeart, 300);
    setInterval(createStar, 400);
}

// Начало истории
document.getElementById("btnYes").onclick = () => startDialogue(dialogues.yes);
document.getElementById("btnNo").onclick = () => startDialogue(dialogues.no);
</script>
</body>
</html>
