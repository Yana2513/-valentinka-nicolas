<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para ti, Nicolás</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: black;
            overflow-x: hidden;
        }

        h1 {
            font-size: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background-color: hotpink;
            color: white;
        }

        #message {
            margin-top: 30px;
            font-size: 24px;
        }

        /* Падающие сердечки */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: crimson;
            transform: rotate(45deg);
            animation: fall 5s linear infinite;
            z-index: 9999;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: crimson;
            border-radius: 50%;
        }

        .heart::before { top: -10px; left: 0; }
        .heart::after { top: 0; left: -10px; }

        @keyframes fall {
            0% { transform: translateY(0) rotate(45deg); opacity: 1; }
            100% { transform: translateY(700px) rotate(45deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <h1>¿Eres un idiota? (♡°▽°♡)</h1>
    <button id="btnYes">Sí</button>
    <button id="btnNo">No</button>

    <p id="message"></p>
    <div id="nextButtonContainer"></div>

    <script>
        // Функция для создания сердечек
        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.animationDuration = 3 + Math.random() * 2 + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }

        let heartInterval;

        // Нажатие на "Sí"
        document.getElementById("btnYes").onclick = function() {
            document.getElementById("message").innerHTML = "Sí, lo sé. ;)";
            document.getElementById("nextButtonContainer").innerHTML = '<button id="nextYes">¿y ahora qué?</button>';

            document.getElementById("nextYes").onclick = function() {
                startHeartsAndMessage();
            };
        };

        // Нажатие на "No"
        document.getElementById("btnNo").onclick = function() {
            document.getElementById("message").innerHTML = "¿estás seguro de eso?";
            document.getElementById("nextButtonContainer").innerHTML = '<button id="nextNo">¿y ahora qué?</button>';

            document.getElementById("nextNo").onclick = function() {
                startHeartsAndMessage();
            };
        };

        // Функция, которая показывает финальный текст и сердечки
        function startHeartsAndMessage() {
            document.getElementById("message").innerHTML = "Я люблю тебя(´｡• ω •｡`) ♡";

            // Начинаем падающие сердечки
            heartInterval = setInterval(createHeart, 300);
        }
    </script>
</body>
</html>
