<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para ti, Nicolás</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 50px;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    color: black;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    transition: background 1s;
}
h1 {
    font-size: 40px;
    margin: 20px;
}
button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}
button:hover {
    transform: scale(1.1);
    background-color: hotpink;
    color: white;
}
#message { margin-top: 30px; font-size: 24px; }
#finalScreen {
    display: none;
    background: white;
    width: 100%;
    min-height: 100vh;
    color: black;
    position: relative;
    overflow: hidden;
}
#finalMessage {
    font-size: 50px;
    font-weight: bold;
    margin-top: 100px;
}
#finalMessage span {
    display: inline-block;
    opacity: 0;
    transform: translateY(-20px);
    animation: letterAppear 0.5s forwards;
}
#heartArt {
    font-size: 100px;
    color: crimson;
    animation: heartPulse 1s infinite alternate;
    margin-top: 20px;
}

/* Пульс сердечка */
@keyframes heartPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* Падающие разноцветные сердечки */
.heart {
    position: absolute;
    width: 20px;
    height: 20px;
    transform: rotate(45deg);
    animation: fall 5s linear infinite;
    z-index: 9999;
}
.heart::before, .heart::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 50%;
}
.heart.red { background-color: crimson; }
.heart.red::before, .heart.red::after { background-color: crimson; }
.heart.pink { background-color: hotpink; }
.heart.pink::before, .heart.pink::after { background-color: hotpink; }
.heart.yellow { background-color: gold; }
.heart.yellow::before, .heart.yellow::after { background-color: gold; }
.heart::before { top: -10px; left: 0; }
.heart::after { top: 0; left: -10px; }

/* Падающие звездочки */
.star {
    position: absolute;
    width: 8px;
    height: 8px;
    background: gold;
    border-radius: 50%;
    animation: starFall linear infinite;
    opacity: 0.8;
}

/* Анимации */
@keyframes letterAppear { 0%{opacity:0;transform:translateY(-20px);}100%{opacity:1;transform:translateY(0);} }
@keyframes fall {0%{transform:translateY(0) rotate(0deg);opacity:1;}50%{transform:rotate(180deg);}100%{transform:translateY(700px) rotate(360deg);opacity:0;}}
@keyframes starFall {0%{transform:translateY(0) scale(1) rotate(0deg);opacity:1;}100%{transform:translateY(600px) scale(0.5) rotate(360deg);opacity:0;}}

/* Адаптив */
@media(max-width:600px){
    h1{font-size:28px;padding:10px;}
    button{font-size:18px;padding:12px 20px;margin:5px;}
    #message{font-size:20px;}
    #finalMessage{font-size:36px;}
    #finalMessage span{font-size:36px;}
    #heartArt{font-size:60px;}
    .heart{width:15px;height:15px;}
    .heart::before,.heart::after{width:15px;height:15px;}
    .star{width:6px;height:6px;}
}
</style>
</head>
<body>
<h1>¿Eres un idiota? (♡°▽°♡)</h1>
<div id="message"></div>
<div id="buttons">
    <button id="btnYes">Sí</button>
    <button id="btnNo">No</button>
</div>

<!-- Финальный экран -->
<div id="finalScreen">
    <div id="finalMessage"></div>
    <div id="heartArt">❤</div>
</div>

<script>
let heartInterval;
const colors = ["red","pink","yellow"];

// Создание сердечек
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart " + colors[Math.floor(Math.random()*colors.length)];
    heart.style.left = Math.random()*window.innerWidth+"px";
    heart.style.animationDuration = 3 + Math.random()*2 + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}

// Создание звездочек
function createStar() {
    const star=document.createElement("div");
    star.className="star";
    star.style.left=Math.random()*window.innerWidth+"px";
    const size=4+Math.random()*6;
    star.style.width=size+"px";
    star.style.height=size+"px";
    star.style.animationDuration=(2+Math.random()*2)+"s";
    document.body.appendChild(star);
    setTimeout(()=>star.remove(),3000);
}

// Диалоги
const dialogues={
    yes:[
        {text:"sí?", button:"Sí"},
        {text:"¿cree que puede haber tetas?", button:"¡si!!! (´♡‿♡`)"},
        {text:"¡no son tetas!", button:"NOOO (ಥ﹏ಥ)"},
        {text:"¡Vete al diablo!٩(ఠ益ఠ)۶", button:"aceptar y llorar (╥_╥)"}
    ],
    no:[
        {text:"sí", button:"no"},
        {text:"Sí!(ノ°益°)ノ", button:"NO! (☆ω☆)"},
        {text:"Si.", button:"sí, soy un idiota"},
        {text:"sí, lo sé (￢‿￢ )", button:"aceptar y llorar (╥_╥)"}
    ]
};

// Старт диалога
function startDialogue(path){
    let index=0;
    const msg=document.getElementById("message");
    const btnDiv=document.getElementById("buttons");

    function nextStep(){
        if(index<path.length){
            msg.innerHTML=path[index].text;
            btnDiv.innerHTML=`<button id="dialogBtn">${path[index].button}</button>`;
            document.getElementById("dialogBtn").onclick=()=>{
                index++;
                nextStep();
            };
        }else{
            showFinalScreen();
        }
    }
    nextStep();
}

// Финальный экран
function showFinalScreen(){
    document.getElementById("message").style.display="none";
    document.getElementById("buttons").style.display="none";
    const final=document.getElementById("finalScreen");
    final.style.display="block";

    // Анимация букв
    const text="Я люблю тебя(´｡• ω •｡`) ♡";
    const finalMsg=document.getElementById("finalMessage");
    finalMsg.innerHTML="";
    for(let i=0;i<text.length;i++){
        const span=document.createElement("span");
        span.textContent=text[i];
        span.style.animationDelay=(i*0.1)+"s";
        finalMsg.appendChild(span);
    }

    // Сердечки и звездочки
    heartInterval=setInterval(createHeart,300);
    setInterval(createStar,400);
}

document.getElementById("btnYes").onclick=()=>startDialogue(dialogues.yes);
document.getElementById("btnNo").onclick=()=>startDialogue(dialogues.no);
</script>
</body>
</html>
